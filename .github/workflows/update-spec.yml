name: Update Spec
# Cloudflare updates its document most days. Once a week, open a pull request
# with the latest, saying whether the generator still accepts it.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Download the latest document
        id: spec
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/cloudflare/api-schemas/commits/main --jq .sha)
          curl -fsSL -o openapi/cloudflare/v4/openapi.yaml \
            "https://raw.githubusercontent.com/cloudflare/api-schemas/$sha/openapi.yaml"
          # The README says which commit is vendored.
          sed -i -E "s/\`[0-9a-f]{40}\`/\`$sha\`/" README.md
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha::7}" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- openapi; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Adds a feature for every product the document added, and drops those
      # it dropped. The build that rewrites them fails, so that one is let be.
      - name: Update Product Features
        if: steps.spec.outputs.changed == 'true'
        env:
          CLOUDFLARE_RS_SYNC_FEATURES: "1"
        run: nix develop --command cargo check || true
      - name: Generate
        if: steps.spec.outputs.changed == 'true'
        env:
          CLOUDFLARE_RS_CHECK: "1"
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "Updates \`openapi/cloudflare/v4/openapi.yaml\` to cloudflare/api-schemas@${{ steps.spec.outputs.sha }}."
            echo
          } > "$body"
          if nix develop --command cargo check > "$RUNNER_TEMP/generate.log" 2>&1; then
            echo "openapi-to-rust generates the whole API from it." >> "$body"
          else
            {
              echo "**openapi-to-rust rejects it.** The fix goes in \`openapi/cloudflare/v4/overlay.yaml\`:"
              echo
              echo '```'
              grep -v '⚠️' "$RUNNER_TEMP/generate.log" | tail -20
              echo '```'
            } >> "$body"
          fi
      - name: Create Pull Request
        if: steps.spec.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: update-spec
          delete-branch: true
          add-paths: |
            openapi/cloudflare/v4/openapi.yaml
            Cargo.toml
            README.md
          commit-message: "chore(spec): update to cloudflare/api-schemas@${{ steps.spec.outputs.short }}"
          title: "chore(spec): update to cloudflare/api-schemas@${{ steps.spec.outputs.short }}"
          body-path: ${{ runner.temp }}/body.md
          labels: |
            dependencies
