name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Check Formatting
        run: nix develop --command cargo fmt --check
      # Compiling every product takes some 10 minutes and over 10 GB of memory,
      # so this compiles two, and CLOUDFLARE_CHECK generates the rest.
      - name: Run Clippy
        env:
          CLOUDFLARE_CHECK: "1"
        run: nix develop --command cargo clippy --features client,dns,zones --all-targets -- -D warnings
      - name: Run Tests
        run: nix develop --command cargo test --features client,dns,zones
