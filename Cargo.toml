[lints.cargo]
# Which of the dependencies the generated code uses depends on the products
# that are on: uuid only if one of them has a UUID, say.
unused_dependencies = "allow"

[build-dependencies]
# Generates the API from the OpenAPI document, in build.rs. Without the `cli`
# default it is only the library: no clap, no reqwest. From main until a
# release has the fixes this needs (gpu-cli/openapi-to-rust#90, #91, #92).
openapi-to-rust = { git = "https://github.com/gpu-cli/openapi-to-rust", rev = "2e1f1db4ea41642845dc8c122d1dcf34d2159351", default-features = false }
# Reads each operation's product from the document.
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "list_zones"
required-features = ["client", "zones"]

# build.rs parses the 20 MB Cloudflare document and generates over a million
# lines from it, which takes minutes unoptimized and seconds optimized.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
