[package]
name = "cloudflare"
version = "0.1.0"
edition = "2024"
authors = ["iamralch"]
readme = "README.md"
# This crate is MIT, and the Cloudflare document it vendors BSD-3-Clause.
license = "MIT AND BSD-3-Clause"
# A git dependency only: see the README.
publish = false

[dependencies]
# The model types, which every product feature generates.
base64 = { version = "0.23", optional = true }
bytes = { version = "1", features = ["serde"], optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", features = ["serde"], optional = true }
uuid = { version = "1", features = ["serde"], optional = true }

# The client side, behind the `client` feature, so a crate that only needs the
# types compiles no HTTP client.
futures-timer = { version = "3", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["multipart", "query", "rustls", "stream"], optional = true }
reqwest-middleware = { version = "0.5", features = ["multipart", "query"], optional = true }
serde_urlencoded = { version = "0.7", optional = true }
thiserror = { version = "2", optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The client's timeouts and retry backoff sleep on futures-timer, which on
# wasm needs the browser's timers.
futures-timer = { version = "3", features = ["wasm-bindgen"], optional = true }

[features]
# What every product's types need. Each product feature turns it on: on its
# own, it adds nothing.
types = [
  "dep:base64",
  "dep:bytes",
  "dep:chrono",
  "dep:serde",
  "dep:serde_json",
  "dep:url",
  "dep:uuid",
]
# HttpClient, a typed client for every operation.
client = [
  "dep:futures-timer",
  "dep:futures-util",
  "dep:reqwest",
  "dep:reqwest-middleware",
  "dep:serde_urlencoded",
  "dep:thiserror",
  "dep:tracing",
]

