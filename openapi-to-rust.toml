# How the API is generated. build.rs reads it, generates into OUT_DIR, and picks
# the operations from the crate's features. The openapi-to-rust CLI reads it
# too, to see the whole API's generated code without building it:
#
#   openapi-to-rust generate --config openapi-to-rust.toml

[generator]
spec_path = "openapi/cloudflare/v4/openapi.yaml"
# Where the CLI writes. build.rs replaces it.
output_dir = "target/openapi-to-rust"
module_name = "v4"
overlays = ["openapi/cloudflare/v4/overlay.yaml"]

# A `*_builder()` beside every operation with more than three optional
# parameters, as most of Cloudflare's list operations have.
[generator.builders]
enabled = true

[features]
enable_async_client = true

[http_client.tracing]
enabled = false
